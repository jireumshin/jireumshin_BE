services:
  api:
    # CI(GitHub Actions)에서 빌드해 ECR에 올린 이미지를 EC2가 pull
    # 로컬에서 도커로 빌드하려면 docker-compose.override.yml(gitignore)에 build: . 추가
    image: 121913092463.dkr.ecr.ap-northeast-2.amazonaws.com/jireumshin-be:latest
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      APP_URL: ${APP_URL:-https://www.jireumshin.shop}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://api.jireumshin.shop/auth/kakao/callback}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: unless-stopped
# DB(Postgres)는 Prisma 붙이는 단계에서 추가 예정
