name: Deploy BE (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-be-prod
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jireumshin-be
  EC2_DEPLOY_DIR: /home/ubuntu/jireumshin_BE

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"

      - name: Deploy on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # EC2에서 실행할 배포 스크립트 (인스턴스 역할로 ECR 인증 → pull → 재기동)
          SCRIPT="set -e
          cd $EC2_DEPLOY_DIR
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
          docker compose pull
          docker compose up -d
          docker image prune -f"
          PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy BE ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify /health
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.jireumshin.shop/health; then echo; echo "health OK"; exit 0; fi
            echo "retry $i..."; sleep 5
          done
          echo "health check failed"; exit 1
