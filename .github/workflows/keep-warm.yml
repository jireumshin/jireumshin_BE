name: Keep warm

# Render 무료 인스턴스는 15분 유휴 시 sleep → 14분마다 깨워 첫 요청 지연(~1분) 방지
# GitHub 예약 실행은 지연될 수 있어 완벽하진 않음 — FE ServerGuard가 늦은 기상도 기다림
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors https://api.jireumshin.shop/health
