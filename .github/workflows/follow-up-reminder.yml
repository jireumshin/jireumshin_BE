name: Follow-up reminder

on:
  schedule:
    - cron: '0 1 * * *' # 매일 10:00 KST
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Render 무료 인스턴스가 잠들어 있으면 첫 요청에 ~1분 걸림 → 넉넉한 타임아웃 + 재시도
      - name: Trigger follow-up reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            https://api.jireumshin.shop/internal/follow-up-reminders
